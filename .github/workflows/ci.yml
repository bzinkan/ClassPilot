name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STUDENT_TOKEN_SECRET: ${{ secrets.STUDENT_TOKEN_SECRET }}
          GOOGLE_OAUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.GOOGLE_OAUTH_TOKEN_ENCRYPTION_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
      - run: npm run test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STUDENT_TOKEN_SECRET: ${{ secrets.STUDENT_TOKEN_SECRET }}
          GOOGLE_OAUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.GOOGLE_OAUTH_TOKEN_ENCRYPTION_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
      - run: npm run test:extension:chrome
      - run: npm run build
      - run: bash extension/package-extension.sh
      - run: npm run test:extension:package

  chrome-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Historical fixtures require newer native storage/debugger APIs. The
      # default job retains their upgrade cases and all red-on-old proofs.
      CLASSPILOT_COMPATIBILITY_RUN: '1'
    strategy:
      fail-fast: false
      matrix:
        chrome: ['120.0.6099.109', '133.0.6943.141']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install the exact compatibility browser
        env:
          CHROME_VERSION: ${{ matrix.chrome }}
        run: |
          curl --fail --location --retry 3 "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip" --output "$RUNNER_TEMP/chrome-compat.zip"
          unzip -q "$RUNNER_TEMP/chrome-compat.zip" -d "$RUNNER_TEMP/chrome-compat"
          CHROME_PATH="$RUNNER_TEMP/chrome-compat/chrome-linux64/chrome"
          "$CHROME_PATH" --version | tee "$RUNNER_TEMP/chrome-version.txt"
          grep -F "$CHROME_VERSION" "$RUNNER_TEMP/chrome-version.txt"
          echo "CLASSPILOT_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - run: npm run test:extension:chrome:behavior
      - run: bash extension/package-extension.sh
      - run: npm run test:extension:package
